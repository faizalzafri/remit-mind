services:
  yente-index:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: yente-index
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - node.name=yente-index
      - cluster.name=opensanctions-index
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - yente-index-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9200/_cluster/health || exit 1"]

  yente:
    image: ghcr.io/opensanctions/yente:5.5.0
    container_name: yente
    depends_on:
      yente-index:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      YENTE_INDEX_TYPE: "elasticsearch"
      YENTE_INDEX_URL: http://yente-index:9200
      # Free/non-commercial tier only. Screening real customer data would
      # need a paid OpenSanctions license.
      YENTE_MANIFEST: /app/manifests/civic.yml
      OPENSANCTIONS_DELIVERY_TOKEN: "${YENTE_BULK_KEY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s

volumes:
  yente-index-data:
