spring:
  application:
    name: remit-mind
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama} # google-genai or ollama - selects which chat model auto-configures
      embedding: ${AI_EMBEDDING_PROVIDER:ollama} # gates OllamaEmbeddingAutoConfiguration (checks spring.ai.model.embedding)
      embedding.text: ${AI_EMBEDDING_PROVIDER:ollama} # gates GoogleGenAiTextEmbeddingAutoConfiguration (checks spring.ai.model.embedding.text instead - a different property, verified against 2.0.0 source)
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash
            temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
    ollama:
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        temperature: 0.3
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    mcp:
      server:
        name: remitmind-tools
        version: 0.0.1
        instructions: "Compliance-related lookup tools for international remittances: live FX rates and destination-country transfer limits."
        protocol: STREAMABLE # must be set explicitly - the webmvc router bean's @ConditionalOnProperty has matchIfMissing=false, so McpServerProperties' own Java-level default of STREAMABLE doesn't satisfy it
      client:
        stdio:
          connections:
            filesystem:
              command: ${MCP_FILESYSTEM_COMMAND:npx.cmd} # Windows needs the .cmd shim explicitly - Java's ProcessBuilder/CreateProcess won't resolve a bare "npx" on Windows (verified: "CreateProcess error=2"); Mac/Linux should override this to "npx"
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - "${MCP_FILESYSTEM_ROOT:./mcp-filesystem-sandbox}"
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
